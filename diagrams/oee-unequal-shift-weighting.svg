<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="DejaVu Sans,sans-serif" role="img"><title>Two shifts, different lengths</title><rect x="0" y="0" width="1000" height="560" rx="26" fill="#f1f6fb"/><text x="56" y="74" fill="#123048" font-size="40" font-weight="700" text-anchor="start">Two shifts, different lengths</text><text x="56" y="121" fill="#38536a" font-size="25" font-weight="400" text-anchor="start">The longer shift accounts for four times as much planned time</text><text x="56" y="181" fill="#123048" font-size="29" font-weight="700" text-anchor="start">Short: 1,800 s planned</text><rect x="56" y="197" width="130.0" height="33" rx="0" fill="#c5d3df"/><rect x="56" y="197" width="130.0" height="33" rx="0" fill="#087f71"/><text x="923" y="227" fill="#087f71" font-size="33" font-weight="700" text-anchor="end">100.00%</text><text x="56" y="284" fill="#123048" font-size="29" font-weight="700" text-anchor="start">Long: 7,200 s planned</text><rect x="56" y="300" width="520.0" height="33" rx="0" fill="#c5d3df"/><rect x="56" y="300" width="260.0" height="33" rx="0" fill="#087f71"/><text x="923" y="330" fill="#087f71" font-size="33" font-weight="700" text-anchor="end">50.00%</text><rect x="56" y="370" width="22" height="22" rx="3" fill="#087f71"/><text x="88" y="390" fill="#38536a" font-size="24" font-weight="400" text-anchor="start">Productive seconds</text><rect x="455" y="370" width="22" height="22" rx="3" fill="#c5d3df"/><text x="488" y="390" fill="#38536a" font-size="24" font-weight="400" text-anchor="start">Lost seconds</text><text x="56" y="464" fill="#38536a" font-size="32" font-weight="400" text-anchor="start">Simple average: 75.00%</text><text x="56" y="516" fill="#087f71" font-size="34" font-weight="700" text-anchor="start">Combined by time: 60.00%</text></svg>
