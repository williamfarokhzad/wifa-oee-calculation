<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="DejaVu Sans,sans-serif" role="img"><title>Where 3,600 seconds go</title><rect x="0" y="0" width="1000" height="560" rx="26" fill="#f1f6fb"/><text x="56" y="74" fill="#123048" font-size="40" font-weight="700" text-anchor="start">Where 3,600 seconds go</text><text x="56" y="121" fill="#38536a" font-size="25" font-weight="400" text-anchor="start">One machine, one part, one synthetic shift</text><text x="56" y="187" fill="#123048" font-size="31" font-weight="700" text-anchor="start">Planned production: 3,600 s</text><rect x="56" y="212" width="148.0" height="75" rx="0" fill="#406c9b"/><rect x="56" y="323" width="30" height="30" rx="4" fill="#406c9b"/><text x="101" y="347" fill="#123048" font-size="29" font-weight="400" text-anchor="start">Stops: 600 s</text><rect x="204.0" y="212" width="123.33333333333333" height="75" rx="0" fill="#d68128"/><rect x="516" y="323" width="30" height="30" rx="4" fill="#d68128"/><text x="561" y="347" fill="#123048" font-size="29" font-weight="400" text-anchor="start">Speed loss: 500 s</text><rect x="327.3333333333333" y="212" width="24.666666666666668" height="75" rx="0" fill="#b54a58"/><rect x="56" y="392" width="30" height="30" rx="4" fill="#b54a58"/><text x="101" y="416" fill="#123048" font-size="29" font-weight="400" text-anchor="start">Rejects: 100 s</text><rect x="352.0" y="212" width="592.0" height="75" rx="0" fill="#087f71"/><rect x="516" y="392" width="30" height="30" rx="4" fill="#087f71"/><text x="561" y="416" fill="#123048" font-size="29" font-weight="400" text-anchor="start">Productive: 2,400 s</text><text x="56" y="501" fill="#087f71" font-size="31" font-weight="700" text-anchor="start">Productive ÷ planned = 66.67% OEE</text></svg>
